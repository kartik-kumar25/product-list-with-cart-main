<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <!-- STYLES -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/other.css">
  <link rel="stylesheet" href="styles/media.css">
  <link rel="stylesheet" href="styles/responsive.css">
  <link rel="stylesheet" href="styles/cart.css">
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Product list with cart</title>

</head>
<body>
  <section class="header-section">
    <h1>Desserts</h1>
  </section>

  <div class="main-content">
    <section class="product-grid js-product-grid">
    </section>

    <section class="cart-container">
      <h3 class="js-cart-quantity">Your Cart (<span>0</span>)</h3>
      <!-- <div>
        <div class="cart-container-inside">
          <img src="assets/images/illustration-empty-cart.svg">
          <p>Your added items will appear here</p>
        </div>
      </div> -->
      <div class="cart-qty-final js-cart-qty-final"></div>
      <div class="total-order">
          <h5>Order Total</h5>
          <div>$0.00</div>
      </div>
      <div class="carbon-msg-container">
        <img src="assets/images/icon-carbon-neutral.svg" alt="icon-carbon-neutral">
        <p>This is a <span>carbon-neutral</span> delivery</p>
      </div>
      <div class="confirm-button">Confirm Order</div>
    </section>
  </div>
</body>
<script type="module" src="javascript/products.js"></script>
<script type="module" src="javascript/cart.js"></script>
</html>
